[package]
name         = "ibc-proto"
version      = "0.52.0"
authors      = ["Informal Systems <hello@informal.systems>"]
edition      = "2021"
license      = "Apache-2.0"
repository   = "https://github.com/cosmos/ibc-proto-rs"
readme       = "README.md"
categories   = ["cryptography::cryptocurrencies", "encoding", "no-std"]
keywords     = ["blockchain", "cosmos", "tendermint", "ibc", "proto"]
exclude      = ["definitions", "tools", ".changelog", ".github"]
description  = """
    ibc-proto provides Cosmos SDK & IBC Protocol Buffers definitions
"""
rust-version = "1.75.0"

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [".", "tools/proto-compiler"]

[lib]
name    = "ibc_proto"
path    = "src/lib.rs"
doctest = false

[features]
default            = ["std", "client", "transport"]
transport          = ["tonic/transport", "cosmos-sdk-proto/grpc-transport"]
std                = [
    "cosmos-sdk-proto/std",
    "prost/std",
    "tonic-prost",
    "bytes/std",
    "subtle-encoding/std",
    "base64/std",
    "flex-error/std",
    "ics23/std",
    "pbjson/std",
]
serde              = [
    "dep:serde",
    "dep:pbjson",
    "ics23/serde",
    "cosmos-sdk-proto/serde",
]
client             = ["std", "dep:tonic", "tonic/codegen"]
json-schema        = ["std", "serde", "tendermint-proto/json-schema", "dep:schemars"]
server             = ["std", "dep:tonic", "tonic/codegen"]
parity-scale-codec = ["tendermint-proto/parity-scale-codec"]
borsh              = ["tendermint-proto/borsh"]
proto-descriptor   = []

[dependencies]
base64                 = { version = "0.22", default-features = false, features = ["alloc"] }
bytes                  = { version = "1.2", default-features = false }
flex-error             = { version = "0.4", default-features = false }
ics23 = { path = "../ics23/rust", package = "ics23", default-features = false }
pbjson = { package = "informalsystems-pbjson", path = "../pbjson/pbjson", default-features = false, optional = true }
prost                  = { version = "0.14", default-features = false, features = ["derive"] }
schemars               = { version = "0.8.22", optional = true }
serde                  = { version = "1.0", default-features = false, optional = true }
subtle-encoding        = { version = "0.5", default-features = false }
tonic                  = { version = "0.14", default-features = false, optional = true }
tonic-prost            = { version = "0.14", optional = true, default-features = false }

cosmos-sdk-proto = { path = "../cosmos-rust/cosmos-sdk-proto", package = "cosmos-sdk-proto", default-features = false }
tendermint-proto = { path = "../tendermint-rs/proto", package = "tendermint-proto", default-features = false }
[dev-dependencies]
serde_json = "1.0.107"
